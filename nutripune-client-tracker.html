<title>NutriPune Client Tracker</title>
<style>
:root{
  --bg: #050505;
  --bg2: #0d0d0d;
  --gold: #F5A800;
  --gold2: #FFC300;
  --gold-dim: rgba(245,168,0,0.12);
  --gold-glow: rgba(245,168,0,0.25);
  --glass: rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --glass-hover: rgba(255,255,255,0.07);
  --text: #f0f0f0;
  --muted: #666;
  --muted2: #999;
  --border: rgba(255,255,255,0.07);
  --danger: #e24b4a;
  --success: #2ecc71;
  --card-radius: 18px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
html{ background:var(--bg); }
body{
  font-family: -apple-system, 'SF Pro Display', 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 90px;
  min-height: 100vh;
}

/* ── Background orbs ── */
body::before{
  content:'';
  position:fixed; top:-20%; left:-10%;
  width:60vw; height:60vw; border-radius:50%;
  background: radial-gradient(circle, rgba(245,168,0,0.06) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}
body::after{
  content:'';
  position:fixed; bottom:-10%; right:-10%;
  width:50vw; height:50vw; border-radius:50%;
  background: radial-gradient(circle, rgba(245,168,0,0.04) 0%, transparent 70%);
  pointer-events:none; z-index:0;
}

/* ── Header ── */
header{
  position:sticky; top:0; z-index:30;
  background: rgba(5,5,5,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  padding: 14px 18px;
  display:flex; align-items:center; justify-content:space-between;
}
.header-logo{ display:flex; align-items:center; gap:10px; }
.header-logo img{ width:34px; height:34px; border-radius:8px; }
header h1{ font-size:17px; font-weight:700; letter-spacing:0.3px; }
header h1 span{ color:var(--gold); }
#modeBadge{ font-size:10px; color:var(--muted2); }

/* ── Container ── */
.container{ max-width:480px; margin:0 auto; padding:14px 14px; position:relative; z-index:1; }

/* ── Glass card ── */
.card{
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--card-radius);
  padding: 16px;
  margin-bottom: 12px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}
.card:active{ background: var(--glass-hover); }

/* ── Buttons ── */
.btn{
  background: linear-gradient(135deg, var(--gold), #e09400);
  color: #000; border: none;
  padding: 11px 16px; border-radius: 12px;
  font-weight: 700; font-size: 14px; cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 4px 15px rgba(245,168,0,0.3);
}
.btn:active{ transform:scale(0.97); box-shadow: 0 2px 8px rgba(245,168,0,0.2); }
.btn.secondary{
  background: var(--gold-dim); color: var(--gold);
  border: 1px solid rgba(245,168,0,0.3); box-shadow: none;
}
.btn.danger{ background: rgba(226,75,74,0.1); color: var(--danger); border: 1px solid rgba(226,75,74,0.3); box-shadow:none; }
.btn.small{ padding:7px 12px; font-size:12px; }
.btn:active{ transform:scale(0.97); }

/* ── Avatar ── */
.avatar{
  width:44px; height:44px; border-radius:14px;
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  display:flex; align-items:center; justify-content:center;
  font-weight:800; color:#000; font-size:15px;
  margin-right:12px; flex-shrink:0;
  box-shadow: 0 4px 12px rgba(245,168,0,0.3);
}

/* ── Client card ── */
.client-card{
  display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; padding:14px 16px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--card-radius);
  margin-bottom: 10px;
  transition: all 0.2s ease;
  position:relative; overflow:hidden;
}
.client-card::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background: linear-gradient(180deg, var(--gold2), var(--gold));
  border-radius:3px 0 0 3px;
}
.client-card:active{ background: var(--glass-hover); transform: scale(0.99); }
.client-name{ font-weight:700; font-size:16px; }
.client-meta{ color:var(--muted2); font-size:12px; margin-top:3px; }
.client-bmi-badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px;
  margin-top:4px; display:inline-block;
}

/* ── Inputs ── */
input, select, textarea{
  width:100%; background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border); color: var(--text);
  padding: 11px 13px; border-radius: 12px; font-size: 14px;
  margin-bottom: 10px; font-family:inherit;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
input:focus, select:focus, textarea:focus{
  outline:none; border-color: rgba(245,168,0,0.5);
  background: rgba(245,168,0,0.04);
}
label{ font-size:11px; color:var(--muted2); display:block; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }

/* ── Tabs inside detail ── */
.tabs{ display:flex; gap:4px; margin-bottom:14px; background:var(--glass); border:1px solid var(--glass-border); border-radius:14px; padding:4px; }
.tab{
  flex:1; padding:8px 4px; color:var(--muted2); font-size:13px; font-weight:600;
  cursor:pointer; border-radius:10px; text-align:center; transition: all 0.2s;
}
.tab.active{ background:var(--gold-dim); color:var(--gold); border:1px solid rgba(245,168,0,0.3); }

/* ── Log items ── */
.log-item{
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  border-left: 3px solid var(--gold);
  animation: slideIn 0.2s ease;
}
@keyframes slideIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
.log-date{ font-size:11px; color:var(--muted2); }
.log-title{ font-weight:700; font-size:14px; margin:3px 0; color:var(--text); }
.log-detail{ font-size:13px; color:var(--muted2); white-space:pre-wrap; margin-top:2px; }
.del-x{ color:var(--danger); font-size:18px; cursor:pointer; padding:0 6px; opacity:0.6; }
.del-x:active{ opacity:1; }

/* ── Stats ── */
.stat-row{ display:flex; gap:8px; }
.stat{
  flex:1; background:rgba(255,255,255,0.03); border:1px solid var(--glass-border);
  border-radius:14px; padding:12px 8px; text-align:center;
}
.stat .num{ font-size:20px; font-weight:800; color:var(--gold); }
.stat .lbl{ font-size:10px; color:var(--muted); margin-top:2px; text-transform:uppercase; letter-spacing:0.4px; }

/* ── Bottom Nav ── */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0;
  background: rgba(5,5,5,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--glass-border);
  display:flex; justify-content:space-around; align-items:center;
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index:40;
}
.nav-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:none; color:var(--muted); font-size:10px;
  padding:4px 6px; cursor:pointer; flex:1; font-family:inherit;
  transition: all 0.2s ease;
}
.nav-item svg{ width:22px; height:22px; stroke:var(--muted); fill:none; stroke-width:1.8; transition: all 0.2s; }
.nav-item.active{ color:var(--gold); }
.nav-item.active svg{ stroke:var(--gold); filter: drop-shadow(0 0 4px rgba(245,168,0,0.5)); }

/* ── FAB ── */
.fab{
  position:fixed; bottom:90px; right:18px;
  width:54px; height:54px; border-radius:16px;
  background: linear-gradient(135deg, var(--gold2), var(--gold));
  color:#000; font-size:26px; border:none;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 6px 20px rgba(245,168,0,0.45);
  cursor:pointer; z-index:45; font-weight:300;
  transition: all 0.2s ease;
}
.fab:active{ transform:scale(0.93); box-shadow: 0 3px 10px rgba(245,168,0,0.3); }

/* ── Modal ── */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;
  animation: fadeIn 0.15s ease;
}
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
.modal{
  background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
  border: 1px solid var(--glass-border);
  width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px 18px;
  max-height:88vh; overflow-y:auto;
  animation: slideUp 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.modal h2{ margin-bottom:14px; font-size:18px; color:var(--gold2); font-weight:800; }
.modal-handle{ width:36px; height:4px; background:var(--glass-border); border-radius:2px; margin:0 auto 16px; }

/* ── Dashboard ── */
.dash-stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px; }
.dash-stat{
  background:var(--glass); border:1px solid var(--glass-border);
  border-radius:16px; padding:16px; text-align:center;
  transition: all 0.2s;
}
.dash-stat .num{ font-size:28px; font-weight:800; color:var(--gold); }
.dash-stat .lbl{ font-size:11px; color:var(--muted2); margin-top:3px; text-transform:uppercase; letter-spacing:0.4px; }
.section-title{
  font-size:11px; color:var(--muted2); font-weight:700;
  margin:16px 0 10px; text-transform:uppercase; letter-spacing:1px;
}
.activity-item{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); }
.activity-item:last-child{ border-bottom:none; }
.activity-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); margin-top:5px; flex-shrink:0; box-shadow:0 0 6px rgba(245,168,0,0.5); }
.activity-client{ font-weight:700; font-size:13px; }
.activity-text{ font-size:13px; color:var(--muted2); }
.activity-date{ font-size:11px; color:var(--muted); margin-top:2px; }

/* ── Chart ── */
.chart-wrap{ background:var(--glass); border:1px solid var(--glass-border); border-radius:16px; padding:14px; margin-bottom:12px; }
.chart-title{ font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; }
canvas{ display:block; width:100% !important; }

/* ── Filters ── */
.filter-pills{ display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; }
.pill{
  padding:7px 14px; border-radius:20px;
  border:1px solid var(--glass-border); color:var(--muted2);
  font-size:12px; white-space:nowrap; cursor:pointer;
  background:var(--glass); transition: all 0.2s; font-weight:600;
}
.pill.active{ background:var(--gold-dim); color:var(--gold); border-color:rgba(245,168,0,0.35); }

/* ── Misc ── */
.row{ display:flex; align-items:center; }
.back-btn{ background:none; border:none; color:var(--gold); font-size:15px; cursor:pointer; margin-bottom:12px; padding:4px 0; font-family:inherit; font-weight:600; }
.empty{ text-align:center; color:var(--muted); padding:40px 10px; font-size:14px; }
.loading{ text-align:center; padding:50px; color:var(--muted); }
.menu-item{ padding:13px 14px; font-size:14px; cursor:pointer; border-bottom:1px solid var(--border); }
.menu-item:last-child{ border-bottom:none; }
.menu-item:active{ background:var(--glass-hover); }
.ai-btn{ background:linear-gradient(135deg,rgba(245,168,0,0.08),rgba(245,168,0,0.04)) !important; color:var(--gold2) !important; border:1px solid rgba(245,168,0,0.25) !important; box-shadow:none !important; }
.ai-loading{ display:flex; align-items:center; gap:10px; padding:24px 0; color:var(--muted2); font-size:14px; }
.spinner{ width:18px; height:18px; border:2px solid rgba(245,168,0,0.2); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.ai-result{ font-size:14px; line-height:1.7; color:#ddd; white-space:pre-wrap; }
.search-box{ margin-bottom:14px; }

/* ── Tab transition ── */
#app{ animation: fadeTab 0.18s ease; }
@keyframes fadeTab{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }

/* ── Save toast ── */
#saveStatus{
  position:fixed; top:68px; left:50%; transform:translateX(-50%);
  padding:7px 16px; border-radius:20px; font-size:12px; z-index:60;
  transition:opacity 0.3s; pointer-events:none; font-weight:600;
}
</style>
</head>

<script>

const STORAGE_KEY = 'np_clients_v1';
let clients = [];
let mainTab = 'clients';
let currentView = { screen: 'list', clientId: null, tab: 'workout' };
const USE_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && window.storage !== null);

const storageAdapter = {
  async get(key){
    if(USE_CLAUDE_STORAGE){
      return await window.storage.get(key, false);
    } else {
      const v = localStorage.getItem(key);
      return v ? { value: v } : null;
    }
  },
  async set(key, value){
    if(USE_CLAUDE_STORAGE){
      return await window.storage.set(key, value, false);
    } else {
      localStorage.setItem(key, value);
      return true;
    }
  }
};

async function loadClients(){
  try{
    const res = await storageAdapter.get(STORAGE_KEY);
    clients = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    clients = [];
  }
  render();
}

let saveInProgress = Promise.resolve();

async function saveClients(){
  saveInProgress = saveInProgress.then(() => doSave());
  return saveInProgress;
}

async function doSave(){
  const payload = JSON.stringify(clients);
  let lastErr = null;
  for(let attempt=0; attempt<5; attempt++){
    try{
      const result = await storageAdapter.set(STORAGE_KEY, payload);
      if(result){
        showSaveStatus('Saved');
        return true;
      }
    }catch(e){
      lastErr = e;
      const delay = 500 * Math.pow(1.6, attempt);
      await new Promise(r=>setTimeout(r, delay));
    }
  }
  console.error('save failed after retries', lastErr);
  showSaveStatus('Could not sync — your changes are kept locally, retrying...', true);
  setTimeout(()=>{ retrySave(payload); }, 3000);
  return false;
}

async function retrySave(payload){
  try{
    const result = await storageAdapter.set(STORAGE_KEY, payload);
    if(result) showSaveStatus('Saved');
  }catch(e){
    setTimeout(()=>{ retrySave(payload); }, 5000);
  }
}

function showSaveStatus(msg, isError){
  let el = document.getElementById('saveStatus');
  if(!el){
    el = document.createElement('div');
    el.id = 'saveStatus';
    el.style.cssText = 'position:fixed; top:60px; left:50%; transform:translateX(-50%); padding:6px 14px; border-radius:20px; font-size:12px; z-index:60; transition:opacity 0.3s;';
    document.body.appendChild(el);
  }
  el.style.background = isError ? '#3a1414' : '#142a1a';
  el.style.color = isError ? '#e24b4a' : '#3b9d6d';
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity = '0'; }, isError ? 4000 : 1200);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d = new Date();
  return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}
function initials(name){
  return name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();

  const weightChange = (firstWeight && lastWeight && firstWeight.id !== lastWeight.id)
    ? (lastWeight.weight - firstWeight.weight).toFixed(1) : null;
  const dietIcon = c.dietType==='veg'?'🥦':c.dietType==='egg'?'🥚':'🍗';
  return `
  <div class="client-card" onclick="openClient('${c.id}')" data-name="${c.name.toLowerCase()}">

          <div class="client-meta">${[c.goal, c.age?c.age+'y':'', c.height?c.height+'cm':''].filter(Boolean).join(' · ')}</div>
          <div style="display:flex; gap:6px; margin-top:5px; flex-wrap:wrap; align-items:center;">
            ${bmi ? `<span style="background:${bmiCat?.color||'var(--gold)'}22; color:${bmiCat?.color||'var(--gold)'}; border-radius:8px; padding:2px 7px; font-size:11px; font-weight:700;">BMI ${bmi}</span>` : ''}
            ${c.dietType ? `<span style="font-size:12px;">${dietIcon}</span>` : ''}
            ${weightChange ? `<span style="font-size:11px; color:${parseFloat(weightChange)<0?'var(--success)':'#FFC300'}; font-weight:700;">${parseFloat(weightChange)>0?'+':''}${weightChange}kg</span>` : ''}
            ${currentW ? `<span style="font-size:11px; color:var(--muted2);">${currentW}kg</span>` : ''}
          </div>
        </div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px; margin-left:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>

function escapeHtml(s){

  d.textContent = s;
  return d.innerHTML;

function calcBMI(weight, height){
  if(!weight || !height) return null;
  return (weight / ((height/100) ** 2)).toFixed(1);
}
function bmiCategory(bmi){
  if(!bmi) return '';
  bmi = parseFloat(bmi);
  if(bmi < 18.5) return { label:'Underweight', color:'#4fc3f7' };
  if(bmi < 25) return { label:'Normal', color:'var(--success)' };
  if(bmi < 30) return { label:'Overweight', color:'#FFC300' };
  return { label:'Obese', color:'var(--danger)' };
}

function compressImage(file, maxWidth=700, quality=0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoSelect(angle, input){
  const file = input.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file);
    window._progressPhotos = window._progressPhotos || {};
    window._progressPhotos[angle] = dataUrl;
    const preview = document.getElementById(`preview_${angle}`);
    if(preview) preview.innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; object-fit:cover;">`;
  }catch(e){

// --- Export / Import ---
function exportData(){
  const dataStr = JSON.stringify(clients, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateTag = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `nutripune-clients-backup-${dateTag}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showSaveStatus('Backup downloaded');
}

async function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('Invalid file format');
    const merge = confirm(`Found ${imported.length} client(s) in this backup.\n\nOK = Merge with existing clients\nCancel = Replace all existing clients`);
    if(merge){
      const existingIds = new Set(clients.map(c=>c.id));
      imported.forEach(c => {
        if(!existingIds.has(c.id)) clients.push(c);
      });
    } else {
      clients = imported;
    }
    await saveClients();
    render();
    alert('Backup imported successfully.');
  }catch(e){
    alert('Could not read this backup file. Make sure it is a valid NutriPune backup JSON.');
  }
  event.target.value = '';
}

// --- Dashboard tab ---
function renderDashboard(app){
  const totalClients = clients.length;
  const totalWorkouts = clients.reduce((s,c)=>s+c.workouts.length, 0);
  const totalDiets = clients.reduce((s,c)=>s+c.diets.length, 0);
  const totalProgress = clients.reduce((s,c)=>s+c.progress.length, 0);

  // Pick best client for chart (most progress entries)
  const chartClient = [...clients].sort((a,b)=>b.progress.length-a.progress.length)[0];
  const chartData = chartClient ? chartClient.progress.filter(p=>p.weight).map(p=>({w:p.weight, d:p.date})) : [];

  const activity = [];
  clients.forEach(c=>{
    c.workouts.forEach(w => activity.push({ client:c.name, type:'Workout', text:w.title, date:w.date, sortKey:w.id, clientId:c.id }));
    c.diets.forEach(d => activity.push({ client:c.name, type:'Diet', text:d.title, date:d.date, sortKey:d.id, clientId:c.id }));
    c.progress.forEach(p => activity.push({ client:c.name, type:'Progress', text: p.weight ? `${p.weight} kg logged` : 'Progress update', date:p.date, sortKey:p.id, clientId:c.id }));
  });
  activity.sort((a,b)=> b.sortKey.localeCompare(a.sortKey));
  const recent = activity.slice(0, 6);

  const typeColor = t => t==='Workout'?'#FFC300':t==='Diet'?'#2ecc71':'#4fc3f7';

  let html = `
    <div class="dash-stat-grid">
      <div class="dash-stat"><div class="num">${totalClients}</div><div class="lbl">Clients</div></div>
      <div class="dash-stat"><div class="num">${totalWorkouts}</div><div class="lbl">Sessions</div></div>
      <div class="dash-stat"><div class="num">${totalDiets}</div><div class="lbl">Diet logs</div></div>
      <div class="dash-stat"><div class="num">${totalProgress}</div><div class="lbl">Check-ins</div></div>
    </div>
  `;

  if(chartData.length >= 2){
    html += `
      <div class="chart-wrap">
        <div class="chart-title">⚖️ ${escapeHtml(chartClient.name)} — Weight Progress</div>
        <canvas id="weightChart" height="130"></canvas>
      </div>
    `;
  }

  html += `<div class="section-title">Recent activity</div>`;
  html += `<div class="card" style="padding:4px 0;">`;
  if(recent.length === 0){
    html += `<div class="empty">No activity yet. Add your first client!</div>`;
  } else {
    html += recent.map(a => `
      <div class="activity-item" onclick="openClient('${a.clientId}')" style="cursor:pointer; padding:10px 14px;">
        <div style="width:8px; height:8px; border-radius:50%; background:${typeColor(a.type)}; margin-top:5px; flex-shrink:0; box-shadow:0 0 6px ${typeColor(a.type)}88;"></div>
        <div style="flex:1;">
          <div class="activity-client">${escapeHtml(a.client)} <span style="color:var(--muted); font-weight:500; font-size:12px;">· ${a.type}</span></div>
          <div class="activity-text">${escapeHtml(a.text)}</div>
          <div class="activity-date">${a.date}</div>
        </div>
      </div>
    `).join('');
  }
  html += `</div>`;
  app.innerHTML = html;

  // Draw chart
  if(chartData.length >= 2){
    requestAnimationFrame(()=>{
      const canvas = document.getElementById('weightChart');
      if(!canvas) return;
      const dpr = window.devicePixelRatio || 1;
      const W = canvas.offsetWidth || 300;
      const H = 130;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const weights = chartData.map(d=>d.w);
      const minW = Math.min(...weights) - 1;
      const maxW = Math.max(...weights) + 1;
      const pad = { l:36, r:12, t:12, b:28 };
      const cW = W - pad.l - pad.r;
      const cH = H - pad.t - pad.b;

      const px = (i) => pad.l + (i/(chartData.length-1)) * cW;
      const py = (w) => pad.t + cH - ((w-minW)/(maxW-minW)) * cH;

      // Grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      [0,0.5,1].forEach(t=>{
        const y = pad.t + t*cH;
        ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
        const label = (maxW - t*(maxW-minW)).toFixed(1);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.font = '10px -apple-system,sans-serif';
        ctx.textAlign='right';
        ctx.fillText(label+'kg', pad.l-4, y+4);
      });

      // Gradient fill
      const grad = ctx.createLinearGradient(0, pad.t, 0, H-pad.b);
      grad.addColorStop(0, 'rgba(245,168,0,0.35)');
      grad.addColorStop(1, 'rgba(245,168,0,0.0)');
      ctx.beginPath();
      ctx.moveTo(px(0), py(chartData[0].w));
      chartData.forEach((d,i)=>{ if(i>0) ctx.lineTo(px(i),py(d.w)); });
      ctx.lineTo(px(chartData.length-1), H-pad.b);
      ctx.lineTo(px(0), H-pad.b);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Line
      ctx.beginPath();
      ctx.moveTo(px(0), py(chartData[0].w));
      chartData.forEach((d,i)=>{ if(i>0) ctx.lineTo(px(i),py(d.w)); });
      ctx.strokeStyle = '#F5A800';
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke();

      // Dots
      chartData.forEach((d,i)=>{
        ctx.beginPath();
        ctx.arc(px(i), py(d.w), 4, 0, Math.PI*2);
        ctx.fillStyle = '#F5A800';
        ctx.fill();
        ctx.strokeStyle = '#050505';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // X labels (first and last)
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.font = '9px -apple-system,sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(chartData[0].d, px(0), H-6);
      ctx.fillText(chartData[chartData.length-1].d, px(chartData.length-1), H-6);
    });
  }
}

// --- AI Features ---
function getGroqKey(){
  return localStorage.getItem('np_groq_key') || '';
}
function setGroqKey(key){
  localStorage.setItem('np_groq_key', key);
}

async function callGroqAPI(promptText){
  const key = getGroqKey();
  if(!key) throw new Error('NO_GROQ_KEY');
  const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${key}`
    },
    body: JSON.stringify({
      model: "llama-3.3-70b-versatile",
      max_tokens: 2000,
      messages: [{ role: "user", content: promptText }]
    })
  });
  if(!response.ok){
    const errText = await response.text().catch(()=>'');
    throw new Error('GROQ_ERROR: ' + errText);
  }
  const data = await response.json();
  const text = data?.choices?.[0]?.message?.content;
  if(!text) throw new Error('No text in Groq response');
  return text;
}

async function callClaudeAPI(promptText){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: promptText }]
    })
  });
  const data = await response.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  if(!textBlock) throw new Error('No text in response');
  return textBlock.text;
}

async function callAI(promptText){
  // Try Claude first (works automatically inside Claude.ai artifact mode)
  if(!USE_CLAUDE_STORAGE){
    // Standalone mode: go straight to Groq
    return await callGroqAPI(promptText);
  }
  try{
    return await callClaudeAPI(promptText);
  }catch(e){
    // Fallback to Groq if a key is configured
    if(getGroqKey()) return await callGroqAPI(promptText);
    throw e;
  }
}

async function generateWorkoutPlan(clientId){

  const lastWeight = [...c.progress].reverse().find(p=>p.weight);
  const firstWeight = c.progress.find(p=>p.weight);
  const weightChange = (firstWeight && lastWeight && firstWeight.id!==lastWeight.id)
    ? `${firstWeight.weight}kg → ${lastWeight.weight}kg (${lastWeight.weight-firstWeight.weight > 0 ? '+' : ''}${(lastWeight.weight-firstWeight.weight).toFixed(1)}kg)`

  document.getElementById('modalOverlay').querySelector('.modal').innerHTML = `

  const prompt = `You are an expert certified personal trainer and strength coach with 10+ years experience. Create a detailed, professional ${days}-day per week workout program.

CLIENT PROFILE:
- Name: ${c.name}
- Age: ${c.age || 'Not specified'}
- Height: ${c.height ? c.height+'cm' : 'Not specified'}
- Current weight: ${weightChange}
- Goal: ${c.goal || 'General fitness'}
- Fitness level: ${c.fitnessLevel || 'Intermediate'}
- Training style requested: ${focus}
- Equipment available: ${equip}
- Injuries/restrictions: ${injury || 'None'}
- Diet type: ${c.dietType || 'Not specified'}
- Medical notes: ${c.medical || 'None'}

RECENT WORKOUT HISTORY (last 5 sessions):
${recentWorkouts || 'No previous workout history - this is a new client, start conservatively.'}

INSTRUCTIONS:
Create a complete ${days}-day weekly workout program. For each training day include:
1. Day name and muscle group focus
2. Warm-up (5-10 min)
3. Main exercises with: Sets x Reps, Rest time, and specific weight recommendations based on their level
4. Cool-down/stretching
5. Any coaching notes for that day

Also include:
- Weekly training split overview at the top
- Progressive overload tips
- Rest day recommendations
- 1 key tip specific to their goal (${c.goal || 'fitness'})

Be specific with weights (use kg), realistic for their level, and make the plan actually achievable. Do NOT add word limits to yourself — give a complete, professional plan.`;

  try{
    const result = await callAI(prompt);
    const modal = document.getElementById('modalOverlay').querySelector('.modal');
    modal.dataset.aiText = result;
    modal.innerHTML = `
      <div class="modal-handle"></div>
      <h2>✨ ${days}-Day Workout Plan</h2>
      <div class="ai-result" style="max-height:60vh;overflow-y:auto;font-size:13px;line-height:1.7;">${escapeHtml(result)}</div>
      <div class="row" style="gap:10px;margin-top:14px;">
        <button class="btn" style="flex:1;" onclick="saveAiPlanToLog('workout','${clientId}','AI ${days}-Day Workout Plan')">Save to logs</button>
        <button class="btn secondary" style="flex:1;" onclick="closeModal()">Close</button>
      </div>
    `;
  }catch(e){
    document.getElementById('modalOverlay').querySelector('.modal').innerHTML = aiErrorContent(e)+'<button class="btn secondary" style="width:100%;margin-top:10px;" onclick="closeModal()">Close</button>';
  }
}

async function aiSuggestDiet(clientId){
  const c = clients.find(x=>x.id===clientId);
  const dt = c.dietType||'non-veg';
  showModal(`
    <h2>✨ AI Diet Plan</h2>
    <label>Diet preference</label>
    <div class="row" style="gap:8px;margin-bottom:10px;">
      <div id="adt_veg" class="pill ${dt==='veg'?'active':''}" style="flex:1;text-align:center;" onclick="selAIDiet('veg')">🥦 Veg</div>
      <div id="adt_egg" class="pill ${dt==='egg'?'active':''}" style="flex:1;text-align:center;" onclick="selAIDiet('egg')">🥚 Egg</div>
      <div id="adt_nonveg" class="pill ${dt==='non-veg'?'active':''}" style="flex:1;text-align:center;" onclick="selAIDiet('non-veg')">🍗 Non-Veg</div>
    </div>
    <label>Calorie goal</label>
    <select id="ai_kcal">
      <option value="maintenance">Maintenance</option>
      <option value="deficit">Deficit (fat loss)</option>
      <option value="surplus">Surplus (muscle gain)</option>
    </select>
    <label>Meals per day</label>
    <select id="ai_meals"><option value="3">3 meals</option><option value="4">4 meals</option><option value="5">5-6 meals</option></select>
    <label>Avoid / allergies</label>
    <input id="ai_avoid" placeholder="e.g. dairy, peanuts">
    <div class="row" style="gap:10px;margin-top:12px;">
      <button class="btn" style="flex:1;" onclick="generateDietPlan('${clientId}')">Generate ✨</button>
      <button class="btn secondary" style="flex:1;" onclick="closeModal()">Cancel</button>
    </div>
  `);
  window._aiDietType = dt;
}

function selAIDiet(type){
  window._aiDietType = type;
  ['veg','egg','non-veg'].forEach(t=>{
    const el = document.getElementById('adt_'+t.replace('-',''));
    if(el) el.className='pill'+(t===type?' active':'');
  });
}

async function generateDietPlan(clientId){
  const c = clients.find(x=>x.id===clientId);
  const dietType = window._aiDietType||'non-veg';
  const kcal = document.getElementById('ai_kcal').value;
  const meals = document.getElementById('ai_meals').value;
  const avoid = document.getElementById('ai_avoid').value.trim();
  const lw = [...c.progress].reverse().find(p=>p.weight);
  const fw = c.progress.find(p=>p.weight);
  const currentWeight = lw?.weight || c.startWeight;

  // Calculate estimated TDEE
  let tdee = null;
  if(currentWeight && c.height && c.age){
    // Mifflin-St Jeor BMR
    const bmr = (10 * currentWeight) + (6.25 * c.height) - (5 * c.age) + 5;
    tdee = Math.round(bmr * 1.55); // moderate activity multiplier
  }

  document.getElementById('modalOverlay').querySelector('.modal').innerHTML = `
    <h2>✨ Building Diet Plan...</h2>
    <div class="ai-loading"><div class="spinner"></div> Calculating macros for ${escapeHtml(c.name)}...</div>
  `;

  const recentDiets = c.diets.slice(-3).map(d=>`${d.title}: ${d.detail}`).join('\n---\n');

  const prompt = `You are a certified Indian sports nutritionist and dietitian. Create a complete, detailed meal plan.

CLIENT PROFILE:
- Name: ${c.name}
- Age: ${c.age || 'Not specified'}
- Height: ${c.height ? c.height+'cm' : 'Not specified'}
- Current weight: ${currentWeight ? currentWeight+'kg' : 'Not specified'}
- Starting weight: ${fw?.weight ? fw.weight+'kg' : 'Not specified'}
- Goal: ${c.goal || 'General fitness'}
- Fitness level: ${c.fitnessLevel || 'Intermediate'}
- Diet preference: ${dietType} (STRICTLY follow this — ${dietType==='veg'?'NO meat, NO eggs':'dietType'==='egg'?'No meat, eggs allowed':'All foods allowed'})
- Estimated TDEE: ${tdee ? tdee+'kcal/day (moderate activity)' : 'Not calculable'}
- Calorie target: ${kcal === 'maintenance' ? `Maintenance (~${tdee||'calculate'} kcal)` : kcal === 'deficit' ? `Deficit (${tdee ? tdee-400 : 'calculate'} kcal, -400 kcal from TDEE)` : `Surplus (${tdee ? tdee+300 : 'calculate'} kcal, +300 kcal from TDEE)`}
- Meals per day: ${meals}
- Foods to avoid: ${avoid || 'None'}
- Workout type: ${c.workouts.length > 0 ? c.workouts[c.workouts.length-1]?.title || 'Gym training' : 'Gym training'}

RECENT DIET HISTORY:
${recentDiets || 'No previous diet history - this is a new client.'}

INSTRUCTIONS:
Create a complete 1-day meal plan using Indian foods. Include:

1. MACRO TARGETS first (Calories, Protein, Carbs, Fats in grams)
2. Each meal with:
   - Exact timing (e.g. 7:00 AM)
   - Food items with specific quantities (grams/cups/pieces)
   - Macros per meal (calories, protein, carbs, fat)
3. Pre/post workout nutrition advice
4. Hydration recommendation
5. Supplement timing (if any — whey, creatine etc)
6. 2-3 practical meal prep tips for Indian lifestyle

Use real Indian foods: dal, roti, rice, sabzi, paneer, chicken, eggs, dahi, buttermilk, sprouts, etc. Make it realistic and affordable. Be very specific with quantities.`;

  try{
    const result = await callAI(prompt);
    const modal = document.getElementById('modalOverlay').querySelector('.modal');
    modal.dataset.aiText = result;
    modal.innerHTML = `
      <div class="modal-handle"></div>
      <h2>✨ Diet Plan (${dietType})</h2>
      <div class="ai-result" style="max-height:60vh;overflow-y:auto;font-size:13px;line-height:1.7;">${escapeHtml(result)}</div>
      <div class="row" style="gap:10px;margin-top:14px;">
        <button class="btn" style="flex:1;" onclick="saveAiPlanToLog('diet','${clientId}','AI ${dietType} Diet Plan')">Save to logs</button>
        <button class="btn secondary" style="flex:1;" onclick="closeModal()">Close</button>
      </div>
    `;
  }catch(e){
    document.getElementById('modalOverlay').querySelector('.modal').innerHTML = aiErrorContent(e)+'<button class="btn secondary" style="width:100%;margin-top:10px;" onclick="closeModal()">Close</button>';
  }
}

async function aiProgressInsight(clientId){
  const c = clients.find(x=>x.id===clientId);
  showAiModal(`✨ AI Progress Analysis — ${escapeHtml(c.name)}`);
  if(c.progress.length === 0){
    document.getElementById('aiContent').innerHTML = `<div class="empty">No progress entries yet. Add weight/measurements first.</div><button class="btn secondary" style="width:100%;margin-top:10px;" onclick="closeModal()">Close</button>`;
    return;
  }
  const progressData = c.progress.map(p=>`Date: ${p.date} | Weight: ${p.weight?p.weight+'kg':'N/A'} | BF: ${p.bf?p.bf+'%':'N/A'} | Notes: ${p.notes||'-'}`).join('\n');
  const measureData = c.progress.filter(p=>p.measurements).map(p=>`${p.date}: Chest ${p.measurements.chest||'-'}cm, Waist ${p.measurements.waist||'-'}cm, Hips ${p.measurements.hips||'-'}cm, Arms ${p.measurements.arms||'-'}cm`).join('\n');
  const recentWorkouts = c.workouts.slice(-5).map(w=>w.title).join(', ');
  const firstW = c.progress.find(p=>p.weight);
  const lastW = [...c.progress].reverse().find(p=>p.weight);
  const weeksBetween = (firstW && lastW && firstW.id!==lastW.id) ? Math.round((new Date(lastW.date) - new Date(firstW.date)) / (7*24*60*60*1000)) : null;
  const prompt = `You are an expert fitness coach doing a detailed progress analysis for a client.

CLIENT PROFILE:
- Name: ${c.name}
- Age: ${c.age||'?'}, Height: ${c.height||'?'}cm
- Goal: ${c.goal||'fitness'}, Level: ${c.fitnessLevel||'intermediate'}
- Diet type: ${c.dietType||'not specified'}
- Time tracked: ${weeksBetween ? weeksBetween+' weeks' : 'Unknown duration'}
- Recent workouts: ${recentWorkouts||'No workout history'}

WEIGHT/BODY PROGRESS:
${progressData}

MEASUREMENT HISTORY:
${measureData || 'No measurement data available'}

INSTRUCTIONS:
Give a detailed, honest progress analysis:

1. PROGRESS SUMMARY: What the numbers actually show (rate of change, trends)
2. IS THE GOAL ON TRACK? Specific assessment for their goal (${c.goal||'fitness'})
3. WHAT'S WORKING: Positive observations
4. AREAS TO IMPROVE: 2-3 specific things to change
5. NEXT 4 WEEKS: Concrete action plan
6. MOTIVATION: One strong, personal message based on their actual data

Be specific, use their actual numbers, and give real coach-level advice. Not generic.`;
  try{
    const result = await callAI(prompt);
    document.getElementById('aiContent').innerHTML = `
      <div class="ai-result" style="font-size:13px;line-height:1.7;">${escapeHtml(result)}</div>
      <button class="btn secondary" style="width:100%;margin-top:14px;" onclick="closeModal()">Close</button>
    `;
  }catch(e){
    document.getElementById('aiContent').innerHTML = aiErrorContent(e);
  }
}

async function saveAiPlanToLog(type, clientId, title){
  const aiText = document.getElementById('modalOverlay').querySelector('.modal').dataset.aiText;
  const c = clients.find(x=>x.id===clientId);
  c[type==='workout'?'workouts':'diets'].push({ id:uid(), date:todayStr(), title, detail:aiText });
  await saveClients();
  closeModal();
  render();
}

const modeBadge = document.getElementById('modeBadge');
if(modeBadge){
  modeBadge.textContent = USE_CLAUDE_STORAGE ? 'synced via Claude' : 'saved on this device only';
  modeBadge.style.color = USE_CLAUDE_STORAGE ? '#3b9d6d' : '#999';
}
